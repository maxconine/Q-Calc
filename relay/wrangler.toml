name = "qcalc-relay"
main = "src/index.js"
compatibility_date = "2026-03-01"
workers_dev = true
preview_urls = false

# one room per host, and per code: earlier releases' code-only rooms, and the claims on locked rooms' codes
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# one list of open rooms per game
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# one inbox per messaging name: who holds it, and their app's open socket
[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Inbox"]

# per ip (an ipv6 address's /64), so codes can't be guessed by brute force and rooms can't be hoarded
[[ratelimits]]
name = "JOINS"
namespace_id = "7301"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "HOSTS"
namespace_id = "7302"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LISTS"
namespace_id = "7303"
simple = { limit = 30, period = 60 }

# messaging: claiming names and opening inboxes, and sending, per ip; and sending per name, whatever the ip
[[ratelimits]]
name = "NAMES"
namespace_id = "7304"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "MESSAGES"
namespace_id = "7305"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "SENDERS"
namespace_id = "7306"
simple = { limit = 10, period = 60 }

# files sent between names (files.js, ledger.js). the ledger is one object holding every file's state and the
# bytes they hold against the hard caps; the bucket holds the encrypted files, each until its recipient
# downloads it, it's taken back or turned down, or it expires. wrangler dev keeps a local bucket of its own
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Ledger"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "qcalc-files"

# every hour: lapsed offers, unused grants, stale uploads and expired files go
[triggers]
crons = ["0 * * * *"]

# offers and upload starts, per ip and per sender name under one namespace (the ledger also caps uploads per
# address per hour, and bytes per sender, per recipient and for the whole bucket)
[[ratelimits]]
name = "UPLOADS"
namespace_id = "7308"
simple = { limit = 10, period = 60 }

# accepting, downloading and taking back files, per ip
[[ratelimits]]
name = "FILE_GETS"
namespace_id = "7309"
simple = { limit = 30, period = 60 }
