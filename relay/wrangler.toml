name = "qcalc-relay"
main = "src/index.js"
compatibility_date = "2026-03-01"
workers_dev = true
preview_urls = false

# one room per pairing code
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# per ip, so codes can't be guessed by brute force and rooms can't be hoarded
[[ratelimits]]
name = "JOINS"
namespace_id = "7301"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "HOSTS"
namespace_id = "7302"
simple = { limit = 10, period = 60 }
