name = "qcalc-relay"
main = "src/index.js"
compatibility_date = "2026-03-01"
workers_dev = true
preview_urls = false

# one room per host, and per code: earlier releases' code-only rooms, and the claims on locked rooms' codes
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# one list of open rooms per game
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# one inbox per messaging name: who holds it, and their app's open socket
[[durable_objects.bindings]]
name = "INBOX"
class_name = "Inbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Inbox"]

# per ip (an ipv6 address's /64), so codes can't be guessed by brute force and rooms can't be hoarded
[[ratelimits]]
name = "JOINS"
namespace_id = "7301"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "HOSTS"
namespace_id = "7302"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LISTS"
namespace_id = "7303"
simple = { limit = 30, period = 60 }

# messaging: claiming names and opening inboxes, and sending, per ip; and sending per name, whatever the ip
[[ratelimits]]
name = "NAMES"
namespace_id = "7304"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "MESSAGES"
namespace_id = "7305"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "SENDERS"
namespace_id = "7306"
simple = { limit = 10, period = 60 }
