name: Windows test

on:
  workflow_dispatch:
    inputs:
      full:
        description: "optimised build and the real installer (slower)"
        type: boolean
        default: false
  push:
    branches:
      - "windows*"
      - "win-*"

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # updater artefacts need a signing key, which a fork doesn't have; the test doesn't need them.
      # bash because powershell's npm shim can swallow the bare --
      # pushes get a quick unoptimised build with no installer; install.ps1 then runs the bare exe
      - shell: bash
        env:
          FULL: ${{ (inputs.full || github.ref == 'refs/heads/windows-full') && '1' || '' }}
        run: |
          if [ -n "$FULL" ]; then
            npm run win:build -- --config "$GITHUB_WORKSPACE/src-tauri/tests/e2e/tauri.e2e.json"
          else
            export CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_OPT_LEVEL=0 CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256
            npm run win:build -- --no-bundle --config "$GITHUB_WORKSPACE/src-tauri/tests/e2e/tauri.e2e.json"
          fi
      - name: Install
        shell: pwsh
        run: ./src-tauri/tests/e2e/install.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src-tauri\tests\e2e\smoke.ps1 -Exe "$env:QCALC_EXE" -OutDir "$env:RUNNER_TEMP\e2e-out"
          exit $LASTEXITCODE
      # the full build's installer, so someone can try it on a real pc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: ${{ runner.temp }}/e2e-out
          if-no-files-found: warn
