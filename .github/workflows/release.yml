name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Sparkle key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is missing. Without it the zip can't be signed and installed copies won't update. See 'Automatic updates' in the README." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve version
        id: version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$PKG" != "$TAG" ]]; then
              echo "package.json version ${PKG} does not match tag ${TAG}" >&2
              exit 1
            fi
          fi
          echo "version=${PKG}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test

      - name: Build zip
        run: npm run mac:package

      # one zip per architecture: each carries only its own code, and each has its own update feed
      - name: Checksum
        id: sha
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for arch in apple-silicon intel; do
            ZIP="macos/dist/Q-Calc-${VERSION}-${arch}.zip"
            SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
            KEY="${arch//-/_}"
            echo "${KEY}_sha256=${SHA}" >> "$GITHUB_OUTPUT"
            echo "${KEY}_zip=${ZIP}" >> "$GITHUB_OUTPUT"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARM_ZIP: ${{ steps.sha.outputs.apple_silicon_zip }}
          INTEL_ZIP: ${{ steps.sha.outputs.intel_zip }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARM_ZIP" "$INTEL_ZIP" --clobber
          else
            gh release create "$TAG" "$ARM_ZIP" "$INTEL_ZIP" \
              --title "Q Calc ${VERSION}" \
              --generate-notes
          fi

      - name: Update Homebrew cask and appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARM_SHA256: ${{ steps.sha.outputs.apple_silicon_sha256 }}
          INTEL_SHA256: ${{ steps.sha.outputs.intel_sha256 }}
          ARM_ZIP: ${{ steps.sha.outputs.apple_silicon_zip }}
          INTEL_ZIP: ${{ steps.sha.outputs.intel_zip }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          zsh macos/update-cask.sh "$VERSION" "$ARM_SHA256" "$INTEL_SHA256"
          UPDATED="${RUNNER_TEMP}/q-calc.rb"
          cp Casks/q-calc.rb "$UPDATED"
          git checkout -B main origin/main
          git pull --ff-only origin main
          mkdir -p Casks
          cp "$UPDATED" Casks/q-calc.rb
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          # apple silicon keeps appcast.xml, the feed every copy installed before the intel build reads
          printf '%s' "$SPARKLE_PRIVATE_KEY" | zsh macos/update-appcast.sh "$ARM_ZIP" "${BASE}/Q-Calc-${VERSION}-apple-silicon.zip"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | QCALC_APPCAST="$PWD/docs/appcast-intel.xml" \
            zsh macos/update-appcast.sh "$INTEL_ZIP" "${BASE}/Q-Calc-${VERSION}-intel.zip"
          if git diff --quiet -- Casks/q-calc.rb docs/appcast.xml docs/appcast-intel.xml; then
            echo "Cask and appcast already match ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/q-calc.rb docs/appcast.xml docs/appcast-intel.xml
          git commit -m "q-calc ${VERSION}" -m "[skip ci]"
          git push origin main

      # the appcast is served by pages; ask for a build in case the bot push didn't start one
      - name: Publish appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null \
            || echo "::warning::Couldn't request a Pages build. Check that docs/appcast.xml is live."
