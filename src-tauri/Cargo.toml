[package]
name = "qcalc"
version = "2.0.2"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
lto = true
opt-level = "s"
strip = true
