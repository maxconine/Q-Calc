[package]
name = "qcalc-win"
description = "Q Calc for Windows, native: Win32 + Direct2D + DirectWrite around the Rust engine (no web view)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "qcalc"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# the bar's pure logic (keybinds, cheat sheet, steady, unitless copy, typst preview text), called in place
qcalc-core = { path = "../core" }

# everything Windows lives behind cfg(windows), so `cargo build` of the workspace on the Mac builds a stub main
[target.'cfg(windows)'.dependencies]
qcalc-ffi = { path = "../ffi", features = ["typst"] }
# games/relay.rs: the relay's websockets (wss through SChannel)
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "native-tls"] }
windows-numerics = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_IO",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Win32, Direct2D and DirectWrite are unsafe FFI. Unsafe stays in the thin wrappers that call them (render.rs,
# window.rs, app.rs, tray.rs, hotkey.rs, autostart.rs, bench.rs' pipe, clip.rs); the model, the field's editing
# and the store are safe Rust.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
