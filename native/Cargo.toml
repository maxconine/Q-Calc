[workspace]
resolver = "3"
members = ["core", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/maxconine/Q-Calc"
rust-version = "1.99"

[workspace.dependencies]
fancy-regex = { version = "0.19", features = ["variable-lookbehinds"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uniffi = "0.32"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
