# The std f64 transcendentals lower to the platform's C library (Apple libm, glibc, the MSVC UCRT), which round
# differently in the last place, so the same input would answer differently per platform. Use
# `scientific::functions::jsmath` (V8's fdlibm, bit for bit) instead. sqrt, mul_add-free arithmetic and powi stay.
disallowed-methods = [
  { path = "f64::sin", reason = "platform libm; use jsmath::sin" },
  { path = "f64::cos", reason = "platform libm; use jsmath::cos" },
  { path = "f64::tan", reason = "platform libm; use jsmath::tan" },
  { path = "f64::sin_cos", reason = "platform libm; use jsmath::sin and jsmath::cos" },
  { path = "f64::asin", reason = "platform libm; use jsmath::asin" },
  { path = "f64::acos", reason = "platform libm; use jsmath::acos" },
  { path = "f64::atan", reason = "platform libm; use jsmath::atan" },
  { path = "f64::atan2", reason = "platform libm; use jsmath::atan2" },
  { path = "f64::sinh", reason = "platform libm; use jsmath::sinh" },
  { path = "f64::cosh", reason = "platform libm; use jsmath::cosh" },
  { path = "f64::tanh", reason = "platform libm; use jsmath::tanh" },
  { path = "f64::asinh", reason = "platform libm; use jsmath::asinh" },
  { path = "f64::acosh", reason = "platform libm; use jsmath::acosh" },
  { path = "f64::atanh", reason = "platform libm; use jsmath::atanh" },
  { path = "f64::exp", reason = "platform libm; use jsmath::exp" },
  { path = "f64::exp2", reason = "platform libm; use jsmath::pow(2.0, x)" },
  { path = "f64::exp_m1", reason = "platform libm; use jsmath::expm1" },
  { path = "f64::ln", reason = "platform libm; use jsmath::ln" },
  { path = "f64::log", reason = "platform libm; use jsmath::ln(x) / jsmath::ln(b)" },
  { path = "f64::log2", reason = "platform libm; use jsmath::log2" },
  { path = "f64::log10", reason = "platform libm; use jsmath::log10" },
  { path = "f64::ln_1p", reason = "platform libm; use jsmath::log1p" },
  { path = "f64::powf", reason = "platform libm; use jsmath::pow" },
  { path = "f64::cbrt", reason = "platform libm; use jsmath::cbrt" },
  { path = "f64::hypot", reason = "platform libm; use jsmath::hypot" },
  { path = "f64::mul_add", reason = "the platform's fma on targets without one; use jsmath's fma" },
  { path = "f64::gamma", reason = "platform libm" },
  { path = "f64::ln_gamma", reason = "platform libm" },
]
